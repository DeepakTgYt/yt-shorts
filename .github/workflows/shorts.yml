name: yt-shorts
on:
  schedule:  # backup only: the Cloudflare Worker "yt-cron" dispatches at the exact IST slot
    - cron: "8 2,5,8,10,12,15 * * *"   # 07:38 10:38 13:38 15:38 17:38 20:38 IST
    - cron: "38 3,6,13 * * *"          # 09:08 12:08 19:08 IST
    - cron: "50 1-17/2 * * *"          # long job-detail video backup check (Worker dispatches instantly)
    - cron: "20 2-17/3 * * *"          # breaking (1000+ posts) backup check
  workflow_dispatch:
    inputs:
      mode: {description: "auto | quiz | vacancy | breaking | welcome | long", required: true, default: auto}
      force: {description: "1 = ignore slot/time/caps", required: false, default: "0"}
      retry: {description: "internal: retry count", required: false, default: "0"}
      dry: {description: "1 = render only, no upload", required: false, default: "0"}
      voice: {description: "test override: edge | omnivoice (blank = workflow default)", required: false, default: ""}
      steps: {description: "test override: OmniVoice steps (blank = 16)", required: false, default: ""}
permissions:
  contents: write
  issues: write
  actions: write
concurrency: {group: "yt-${{ (github.event.inputs.mode == 'long' || github.event.schedule == '50 1-17/2 * * *') && 'long' || 'shorts' }}", cancel-in-progress: false}
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 150  # long videos with OmniVoice take ~45 min
    steps:
      - uses: actions/checkout@v4
      - name: Mode
        id: m
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then m="${{ github.event.inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "20 2-17/3 * * *" ]; then m=breaking;
          elif [ "${{ github.event.schedule }}" = "50 1-17/2 * * *" ]; then m=long; else m=auto; fi
          echo "mode=$m" >> $GITHUB_OUTPUT
      - name: Gate (anything to do?)
        id: g
        env: {FORCE: "${{ github.event.inputs.force }}"}
        run: python3 yt.py ${{ steps.m.outputs.mode }} --gate
      - uses: actions/setup-python@v5
        if: steps.g.outputs.go == '1'
        with: {python-version: "3.12", cache: pip}
      - name: Install
        if: steps.g.outputs.go == '1'
        run: |
          # no apt by default: apt on hosted runners randomly stalls 7-25 min
          mkdir -p $HOME/bin
          if curl -fsSL --retry 3 --max-time 180 -o /tmp/ff.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            tar -xJf /tmp/ff.tar.xz -C /tmp && cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ff* $HOME/bin/ && echo "$HOME/bin" >> $GITHUB_PATH
          fi
          export PATH=$HOME/bin:$PATH
          pip install -q -r requirements.txt
          need=""
          command -v ffmpeg >/dev/null || need="ffmpeg"
          python -c "from PIL import features; assert features.check('raqm')" 2>/dev/null || need="$need libraqm0 libfribidi0"
          if [ -n "$need" ]; then
            echo "apt fallback for: $need"; sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends $need >/dev/null
          fi
          ffmpeg -hide_banner -version >/dev/null && command -v ffmpeg
      - name: VoiceStudio voice (cached)
        if: steps.g.outputs.go == '1'
        id: vc
        uses: actions/cache@v4
        with:
          path: ~/vs
          key: omnivoice-v1-${{ hashFiles('shorts/setup_omnivoice.sh') }}
      - name: Install VoiceStudio (first time only)
        if: steps.g.outputs.go == '1' && steps.vc.outputs.cache-hit != 'true'
        continue-on-error: true
        run: OMNI_HOME=$HOME/vs sh shorts/setup_omnivoice.sh || rm -rf $HOME/vs
      - name: Make + upload Short
        if: steps.g.outputs.go == '1'
        run: python yt.py ${{ steps.m.outputs.mode }} ${{ github.event.inputs.dry == '1' && '--dry' || '' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
          TTS_ENGINE: ${{ github.event.inputs.voice || 'omnivoice' }}  # VoiceStudio/OmniVoice since 18 Nov night test; voice=edge to override; auto-falls back to Edge on error
          OMNIVOICE_STEPS: ${{ github.event.inputs.steps || '16' }}
          OMNIVOICE_PY: /home/runner/vs/venv/bin/python
          OMNIVOICE_MODEL: /home/runner/vs/model
          OMNIVOICE_INSTRUCT: "male, young adult"
      - name: Keep preview
        if: steps.g.outputs.go == '1' && always()
        uses: actions/upload-artifact@v4
        with: {name: short, path: "out/*.mp4", retention-days: 2, if-no-files-found: ignore}
      - name: Save state
        if: steps.g.outputs.go == '1' && always()
        run: |
          git config user.name "ytbot"; git config user.email "ytbot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "short ${{ steps.m.outputs.mode }}" && (for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep $((i*5)); done))
      - name: Retry once, then open an issue
        if: failure()
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          r="${{ github.event.inputs.retry }}"; r=${r:-0}
          if [ "$r" -lt 1 ]; then
            sleep 90
            gh workflow run shorts.yml -f mode=${{ steps.m.outputs.mode }} -f force="${{ github.event.inputs.force }}" -f retry=1 -f dry="${{ github.event.inputs.dry }}" -f voice="${{ github.event.inputs.voice }}" -f steps="${{ github.event.inputs.steps }}" || true
          fi
          gh issue create --title "Short failed: ${{ steps.m.outputs.mode }} $(TZ=Asia/Kolkata date '+%F %H:%M') IST (retry $r)" --body "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
